spring:
  application:
    name: cafeteria-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cafeteria?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: false
        generate_statistics: false
  mvc:
    problem-details:
      enabled: true

# Puerto: Railway inyecta $PORT automaticamente
server:
  port: ${PORT:8080}

debug: false

# Cloudinary (almacenamiento de imagenes)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# AFIP
afip:
  wsass:
    url: https://wsaahomo.afip.gov.ar/ws/services/LoginCms
    service: wsfe
    cert-path: classpath:certs/afip-ws-certificate.p12
    cert-password: ${AFIP_CERT_PASSWORD:}
    ticket-timeout-minutes: 5
  wsfe:
    url: https://wswhomo.afip.gov.ar/wsfev1/service.asmx
  punto-venta: 1
