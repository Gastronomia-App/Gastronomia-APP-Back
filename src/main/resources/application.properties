spring.application.name=cafeteria-api

spring.datasource.url=jdbc:mysql://localhost:3306/cafeteria?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.mvc.problem-details.enabled=true

# Hibernate Batch Fetching Strategy
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Optional: Format SQL for better readability in logs
spring.jpa.properties.hibernate.format_sql=true
app.upload-dir=uploads
# Optional: Show batch fetch optimization in logs
spring.jpa.properties.hibernate.generate_statistics=false

debug=true

# AFIP WSASS Configuration
afip.wsass.url=https://wsaahomo.afip.gov.ar/ws/services/LoginCms

afip.wsass.service=wsfe

afip.wsass.cert-path=classpath:certs/afip-ws-certificate.p12

afip.wsass.cert-password=test123

afip.wsass.ticket-timeout-minutes=5

# AFIP WSFEv1 Configuration
afip.wsfe.url=https://wswhomo.afip.gov.ar/wsfev1/service.asmx

# Sales point number (default 1)
afip.punto-venta=1

