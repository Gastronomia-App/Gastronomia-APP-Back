spring.application.name=cafeteria-api

spring.datasource.url=jdbc:mysql://localhost:3306/cafeteria?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate Batch Fetching Strategy
# Optimizes lazy loading by fetching multiple entities in a single query using IN clause
# Instead of N+1 queries, Hibernate will batch them (e.g., SELECT * FROM items WHERE order_id IN (?, ?, ?))
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Optional: Format SQL for better readability in logs
spring.jpa.properties.hibernate.format_sql=true

# Optional: Show batch fetch optimization in logs
spring.jpa.properties.hibernate.generate_statistics=false

debug=true

